name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Decode and create google-services.json from secret
      run: |
        printf "%s" "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
        # Verify the file was created and is valid JSON
        test -f app/google-services.json && echo "✓ google-services.json created" || (echo "✗ Failed to create google-services.json"; exit 1)
        cat app/google-services.json | head -c 100  # Show first 100 chars for debugging

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Debug APK
      run: ./gradlew assembleDebug

